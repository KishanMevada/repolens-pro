name: Android CI

# When Code Push or PR is there
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # GitHub નું વર્ચ્યુઅલ મશીન

    steps:
      # 1. તમારો કોડ ડાઉનલોડ કરો
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 સેટઅપ કરો
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle ને ચલાવવાની પરમિશન આપો
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. તમે લખેલા યુનિટ ટેસ્ટ રન કરો
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 5. ટેસ્ટ પાસ થાય એટલે એપનું APK બનાવો
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. બનાવેલું APK ડાઉનલોડ કરવા માટે સેવ (Upload) કરો
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk