name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # નોટ: એન્ડ્રોઇડ એમ્યુલેટર macOS સર્વર પર સૌથી ફાસ્ટ ચાલે છે,
    # પણ અત્યારે આપણે ubuntu-latest જ રાખીશું.
    runs-on: macos-13

    steps:
      # 1. તમારો કોડ ડાઉનલોડ કરો
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 સેટઅપ કરો
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle ને ચલાવવાની પરમિશન આપો
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. તમે લખેલા યુનિટ ટેસ્ટ રન કરો (src/test/ વાળા)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # ✅ નવું: 5. UI (Instrumented) ટેસ્ટ રન કરવા માટે એમ્યુલેટર ચાલુ કરો
      - name: Run UI Tests (Android Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29 # બહુ નવો નહિ, એટલે સર્વર પર ફાસ્ટ ચાલુ થાય
          target: default
          arch: x86_64
          script: ./gradlew connectedAndroidTest # UI ટેસ્ટ માટેનો અસલી કમાન્ડ

      # 6. ટેસ્ટ પાસ થાય એટલે એપનું APK બનાવો
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. બનાવેલું APK ડાઉનલોડ કરવા માટે સેવ (Upload) કરો
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk